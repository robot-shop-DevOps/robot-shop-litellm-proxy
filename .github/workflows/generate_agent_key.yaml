name: Generate Agent Key for ADK Agent

on:
  workflow_dispatch:
    inputs:
      agent_id:
        description: 'Agent identifier (lowercase, hyphen-separated)'
        required: true
        type: string

      models:
        description: 'Space-separated list of models'
        required: true
        type: string

      key_validity_days:
        description: 'Number of days the key should be valid for'
        required: false
        type: number

env:
  GCP_PROJECT: robotshop-platform-dev
  WIF_PROVIDER: projects/1034830772222/locations/global/workloadIdentityPools/github-actions/providers/github
  CLOUD_RUN_SERVICE_ACCOUNT: cloud-run@robotshop-platform-dev.iam.gserviceaccount.com
  JWT_SIGNING_SECRET: litellm-proxy-jwt-secret

jobs:
  generate_key:
    runs-on:
      group: Local Runners
      labels: self-hosted

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/wif-login@gcp
        with:
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ env.CLOUD_RUN_SERVICE_ACCOUNT }}
          TOKEN_FORMAT: access_token

      - name: Get JWT signing secret
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/secret-manager-fetch@gcp
        with:
          SECRET_NAME: ${{ env.JWT_SIGNING_SECRET }}
          ENV_NAME: JWT_SECRET
          PROJECT: ${{ env.GCP_PROJECT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate agent key
        id: generate_key
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          set -e

          pip install pyjwt
          python scripts/generate_agent_key.py \
            --agent-id "${{ inputs.agent_id }}" \
            --models "${{ inputs.models }}" \
            --days ${{ inputs.key_validity_days }}

      - name: Push agent key to Google Secret Manager
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/secret-manager-push@gcp
        with:
          SECRET_NAME: litellm-proxy-adk-${{ inputs.agent_id }}-key
          SECRET_VALUE: ${{ steps.generate_key.outputs.token }}
          PROJECT: ${{ env.GCP_PROJECT }}